services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fluenthub
      POSTGRES_USER: fluenthub
      POSTGRES_PASSWORD: fluenthub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluenthub -d fluenthub"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://fluenthub:fluenthub@postgres:5432/fluenthub?sslmode=disable
      STORAGE_PATH: /app/data/storage
      BACKUP_PATH: /app/data/backups
      CLAMAV_ADDRESS: clamav:3310
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - object_storage:/app/data/storage
      - storage_backups:/app/data/backups
    ports:
      - "8080:8080"
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
    volumes:
      - clamav_data:/var/lib/clamav
volumes:
  postgres_data:
  object_storage:
  storage_backups:
  clamav_data:
